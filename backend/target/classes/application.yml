server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medical_risk?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 关闭SQL日志
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    root: INFO
    com.graduation.medical: DEBUG
    com.baomidou.mybatisplus: WARN
    # 抑制反射警告
    com.baomidou.mybatisplus.core.toolkit.support.ReflectLambdaMeta: ERROR
